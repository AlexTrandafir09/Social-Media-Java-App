spring.application.name=follow-service
server.port=8083

spring.datasource.url=jdbc:postgresql://localhost:5435/followservice
spring.datasource.username=${DB_USERNAME:devuser}
spring.datasource.password=${DB_PASSWORD:devpass}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update

app.jwt.secret=${JWT_SECRET:dev-only-jwt-signing-secret-change-this-before-any-real-deployment-1234567890}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
