services:
  user-db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USERNAME:-devuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpass}
      POSTGRES_DB: userservice
    ports:
      - "5436:5432"
    volumes:
      - user-db-data:/var/lib/postgresql/data

volumes:
  user-db-data:
