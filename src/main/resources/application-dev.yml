spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/socialmediaapp
    username: devuser
    password: devpass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: false

logging:
  level:
    root: INFO
    com.socialmediaapp: DEBUG
