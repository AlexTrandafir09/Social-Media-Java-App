services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USERNAME:-devuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpass}
      POSTGRES_DB: socialmediaapp
    ports:
      - "5432:5432"
    volumes:
      - socialmediaapp-db-data:/var/lib/postgresql/data

volumes:
  socialmediaapp-db-data:
