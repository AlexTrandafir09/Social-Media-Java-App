spring.application.name=notification-service
server.port=8081
spring.config.import=configserver:${CONFIG_SERVER_URL:http://localhost:8888}

spring.datasource.url=jdbc:postgresql://localhost:5433/notificationservice
spring.datasource.username=${DB_USERNAME:devuser}
spring.datasource.password=${DB_PASSWORD:devpass}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
