services:
  notification-db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USERNAME:-devuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpass}
      POSTGRES_DB: notificationservice
    ports:
      - "5433:5432"
    volumes:
      - notification-db-data:/var/lib/postgresql/data

volumes:
  notification-db-data:
