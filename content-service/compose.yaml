services:
  content-db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USERNAME:-devuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpass}
      POSTGRES_DB: contentservice
    ports:
      - "5437:5432"
    volumes:
      - content-db-data:/var/lib/postgresql/data

volumes:
  content-db-data:
